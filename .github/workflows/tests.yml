name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t reporting-service:ci .

      - name: Run tests inside container
        run: docker run --rm reporting-service:ci python -m pytest -v

      - name: Start and seed the integration environment
        run: |
          docker compose -f compose.yaml config --services
          docker compose -f compose.yaml up -d --build db api
          

      - name: Wait for the API to be ready
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 1 \
            --retry-max-time 45 --max-time 5 \
            http://127.0.0.1:8000/ready

      - name: Verify the report against PostgreSQL
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:8000/reports?start_date=2026-09-01&end_date=2026-09-30" \
            | python -c 'import json, sys; total = json.load(sys.stdin)["total_weight"]; assert total == 500, f"Expected 500, got {total}"; print(f"Verified September total: {total}")'

      - name: Show service status and logs on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a --no-trunc
          docker compose logs --tail=50 api db

      - name: Remove the CI containers and test data
        if: ${{ always() }}
        run: docker compose down -v