name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t reporting-service:ci .

      - name: Run tests inside container
        run: docker run --rm reporting-service:ci python -m pytest -v
      - name: Start and seed the integration environment
        run: |
          docker compose -f compose.yaml config --services
          docker compose -f compose.yaml up -d --build db api
          docker compose -f compose.yaml exec -T db psql -U reporting_user -d reporting -v ON_ERROR_STOP=1 < seed.sql

      - name: Show service status and logs on failure
        if: ${{ failure() }}
        run: |
          docker compose ps -a --no-trunc
          docker compose logs --tail=50 api db

      - name: Remove the CI containers and test data
        if: ${{ always() }}
        run: docker compose down -v