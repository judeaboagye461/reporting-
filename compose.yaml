services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://reporting_user:local_practice_only@db:5432/reporting
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reporting
      POSTGRES_USER: reporting_user
      POSTGRES_PASSWORD: local_practice_only
    volumes:
      - reporting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting_user -d reporting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reporting_data: